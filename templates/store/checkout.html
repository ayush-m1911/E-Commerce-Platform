{% extends "base.html" %}

{% load static %}
{% block content %}
<section class="section-content padding-y bg">
<div class="container">

<!-- ============================ COMPONENT 1 ================================= -->

<div class="row">
	<aside class="col-lg-6">
<div class="card">
    <div class="card-body">
        <h4 class="card-title mb-4">Billing Details</h4>

        <form action="{% url 'place_order' %}" method="POST">
            {% csrf_token %}

            <div class="form-group">
    <label>First Name</label>
    <input type="text" name="first_name" class="form-control" placeholder="First name">
</div>

<div class="form-group">
    <label>Last Name</label>
    <input type="text" name="last_name" class="form-control" placeholder="Last name">
</div>


            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" name="email" class="form-control" id="email" placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="text" name="phone" class="form-control" id="phone" placeholder="Enter your phone number">
            </div>

            <div class="form-group">
                <label for="address_line_1">Address Line 1</label>
                <input type="text" name="address_line_1" class="form-control" id="address_line_1" placeholder="House number, street name">
            </div>

            <div class="form-group">
                <label for="address_line_2">Address Line 2</label>
                <input type="text" name="address_line_2" class="form-control" id="address_line_2" placeholder="Apartment, suite, landmark (optional)">
            </div>

            <div class="form-group">
                <label for="city">City</label>
                <input type="text" name="city" class="form-control" id="city" placeholder="City">
            </div>

            <div class="form-group">
                <label for="state">State</label>
                <input type="text" name="state" class="form-control" id="state" placeholder="State">
            </div>

            <div class="form-group">
                <label for="country">Country</label>
                <input type="text" name="country" class="form-control" id="country" placeholder="Country">
            </div>

            <div class="form-group">
                <label for="order_note">Order Note</label>
                <textarea name="order_note" rows="4" class="form-control" id="order_note"
                    placeholder="Any special instructions for delivery"></textarea>
            </div>

</div> <!-- card.// -->

	</aside> <!-- col.// -->
	<aside class="col-lg-6">

		<div class="card">
		<div class="card-body">
			<table class="table table-borderless table-shopping-cart">
<thead class="text-muted">
<tr class="small text-uppercase">
  <th scope="col">Product</th>
  <th scope="col" width="120">Quantity</th>
  <th scope="col" width="120">Price</th>
  
</tr>
</thead>
<tbody>
{% for cart_item in cart_items%}
<tr>
	<td>
		<figure class="itemside align-items-center">
			<div class="aside"><img src="{{cart_item.product.images.url}}" class="img-sm"></div>
			<figcaption class="info">
				<a href="{{ cart_item.product.get_url }}" class="title text-dark">{{cart_item.product.product_name}}</a>
				<p class="text-muted small">
					{% if cart_item.variation.all %}
					 {% for variation in cart_item.variation.all %}
						{{ variation.variation_category | capfirst }} : {{ variation.variation_value }} {% if not forloop.last %} <br> {% endif %}
					 {% endfor %}
					{% endif %}
				</p>
			</figcaption>
		</figure>
	</td>
	<td> 
		<!-- col.// -->
					<div class="col"> 
						<div class="input-group input-spinner">

   

    <input type="text" class="form-control text-center"
           value="{{ cart_item.quantity }}" readonly>

   
</div>

					</div> <!-- col.// -->
	</td>
	<td> 
		<div class="price-wrap"> 
			<var class="price">${{cart_item.sub_total}}</var> 
			<small class="text-muted"> ${{cart_item.product.price}} each</small> 
		</div> <!-- price-wrap .// -->
	</td>
	
</tr>
{% endfor %}
</tbody>
</table>
			<button type="submit" name="submit" class="btn btn-primary btn-block"> Place Order </button>
			<a href="{% url 'store' %}" class="btn btn-light btn-block">Continue Shopping</a>
		</div> <!-- card-body.// -->
		</div> <!-- card.// -->
	</form>
</aside> <!-- col.// -->


</div> <!-- row.// -->

<!-- ============================ COMPONENT 1 END .// ================================= -->

</div> <!-- container .//  -->
</section>
<!-- ========================= SECTION CONTENT END// ========================= -->
{% endblock %}
